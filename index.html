import * as THREE from 'three';

/* ═══ 1. Math / noise ═══ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry(1210);
const rr=(a,b)=>a+(b-a)*rng();
const hash2=(x,y)=>{const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);};
function vnoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),u),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),u),v);
}
function fbm(x,y,o=4){let a=.5,s=0,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s/(1-Math.pow(.5,o));}
const ridged=(x,z)=>1-Math.abs(2*fbm(x*0.004+3.1,z*0.004+9.7,4)-1);

/* ═══ 2. Ռելիեֿ ═══ */
const CAS={z0:260,z1:760,n:5,rise:30.8,half:48};
const STEPLEN=(CAS.z1-CAS.z0)/CAS.n;      // 100մ ամեն տեռաս
const STAIR_X0=42, STAIR_X1=48;            // կողքի աստիճանների եզրերը
const STAIR_W=STAIR_X1-STAIR_X0;           // 6մ լայնություն

function mountainH(x,z){
  const f=0.55+0.45*ridged(x,z);
  const N=sstep(600,1500,z)*60*1.9,S=sstep(500,1300,-z)*60*0.35,E=sstep(600,1400,x)*60*0.95,W=sstep(600,1400,-x)*60*1.15;
  return Math.max(N,S,E,W)*f;
}
function cascadeH(x,z){
  const t=(z-CAS.z0)/(CAS.z1-CAS.z0);if(t<=0)return 0;
  const c=CAS.rise*CAS.n*Math.min(t,1),half=150-25*Math.min(t,1);
  return c*(1-sstep(half,half+170,Math.abs(x)))*(1-sstep(CAS.z1,CAS.z1+340,z));
}
const GORGE={x:-20,z:-680,a:420,b:110,depth:38};
const gorgeM=(x,z)=>1-sstep(0.35,1,Math.hypot((x-GORGE.x)/GORGE.a,(z-GORGE.z)/GORGE.b));
const HILL={x:560,z:-150,r:36,out:62,h:10,rx0:442,rx1:526,hw:14};
const hillD=(x,z)=>Math.hypot(x-HILL.x,z-HILL.z);
function hillH(x,z){
  let h=HILL.h*(1-sstep(HILL.r,HILL.out,hillD(x,z)));
  if(x<HILL.x)h=Math.max(h,HILL.h*sstep(HILL.rx0,HILL.rx1,x)*(1-sstep(HILL.hw,HILL.hw+16,Math.abs(z-HILL.z))));
  return h;
}
function catmull(P,seg){const out=[],g=i=>P[clamp(i,0,P.length-1)];
  for(let i=0;i<P.length-1;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;
      out.push([0,1].map(j=>0.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}
  out.push(P[P.length-1].slice());return out;}
const CLP=catmull([[640,0],[760,-90],[860,-260],[840,-520],[700,-720],[420,-830],[60,-870],[-300,-860],[-640,-800],[-900,-620],[-1010,-300],[-1020,60],[-960,420],[-800,700],[-540,830],[-280,840],[-110,790],[-40,768]],12);
const CLS=[0];for(let i=1;i<CLP.length;i++)CLS.push(CLS[i-1]+Math.hypot(CLP[i][0]-CLP[i-1][0],CLP[i][1]-CLP[i-1][1]));
const CLL=CLS[CLS.length-1],CLH=CAS.rise*CAS.n+0.4;
function climbAt(x,z){let bd=1e9,bs=0;
  for(let i=0;i<CLP.length-1;i++){const a=CLP[i],b=CLP[i+1],dx=b[0]-a[0],dz=b[1]-a[1],l2=dx*dx+dz*dz;
    const t=clamp(((x-a[0])*dx+(z-a[1])*dz)/l2,0,1),d=Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t);
    if(d<bd){bd=d;bs=CLS[i]+Math.sqrt(l2)*t;}}
  return[bd,bs];}
function baseH(x,z){
  let h=Math.max(1.2+(fbm(x*0.0035+11,z*0.0035+7,3)-0.5)*2.4+mountainH(x,z),cascadeH(x,z));
  h-=GORGE.depth*gorgeM(x,z);
  h+=hillH(x,z);
  return h;}
function terrainH(x,z){

  if(Math.abs(x)<CAS.half && z>=CAS.z0 && z<=CAS.z1) return 0;
  const hb=baseH(x,z),c=climbAt(x,z),hr=2+(CLH-2)*c[1]/CLL,span=14+Math.max(26,Math.abs(hr-hb)*1.1);
  return c[0]>=span?hb:lerp(hb,hr,1-sstep(14,span,c[0]));}

/* ─ Ֆիզիկա՝ աստիճանների ramp-ը մեքենայի համար ─ */
let TERR=null;
function meshH(x,z){const T=TERR;if(!T)return terrainH(x,z);
  const u=(x-T.X0)/T.ST,v=(z-T.Z0)/T.ST;if(u<0||v<0||u>=T.nx-1||v>=T.nz-1)return terrainH(x,z);
  const i=Math.floor(u),j=Math.floor(v),fx=u-i,fz=v-j,h=T.hs,k=j*T.nx+i,ha=h[k],hb=h[k+1],hd=h[k+T.nx],he=h[k+T.nx+1];
  return fx+fz<=1?ha+(hb-ha)*fx+(hd-ha)*fz:he+(hd-he)*(1-fx)+(hb-he)*(1-fz);}
const CS={x0:51,x1:65,step:0.8,rise:0.25};

/* ⭐ Կողքի աստիճանների ՖԻԶԻԿԱ — սահուն ramp մեքենայի համար */
function casStairH(x,z){
  const ax=Math.abs(x);
  if(ax<STAIR_X0 || ax>STAIR_X1) return -1e9;
  if(z<CAS.z0 || z>CAS.z1) return -1e9;
  const t=(z-CAS.z0)/(CAS.z1-CAS.z0);
  return t*CAS.rise*CAS.n + 0.18;

const sgrid=new Map(),SC=32,sKey=(gx,gz)=>(gx+512)*1024+(gz+512);

function mkTex(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  fn(c.getContext('2d'),w,h);

/* ═══ 5. Batch ═══ */
const batch=new Map();
function addGeoM(geo,mat,m,own=false){
  const g=own?geo:geo.clone();
  if(m)g.applyMatrix4(m);
  for(const k of Object.keys(g.attributes))if(k!=='position'&&k!=='normal'&&k!=='uv')g.deleteAttribute(k);
  if(!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
  if(!g.attributes.normal)g.computeVertexNormals();
  g.clearGroups();
  let l=batch.get(mat);if(!l){l=[];batch.set(mat,l);}l.push(g);
}
function flushBatch(){
  for(const [mat,list] of batch){
    const allIdx=list.every(g=>g.index);
    const L=allIdx?list:list.map(g=>g.index?g.toNonIndexed():g);
    const g=mergeGeometries(L,false);
    const mesh=new THREE.Mesh(g,mat);mesh.matrixAutoUpdate=false;mesh.updateMatrix();mesh.receiveShadow=true;mesh.castShadow=true;scene.add(mesh);
  }
  batch.clear();
}

function facadeGeo(w,h,d,cw,ch){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv;
  const nu=a=>Math.max(1,Math.round(a/cw)),nv=Math.max(1,Math.round(h/ch));
  for(let f=0;f<6;f++){const su=f<2?nu(d):nu(w),sv=(f===2||f===3)?Math.max(1,Math.round(d/ch)):nv;
    for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv);}}
  return g;
}

/* ═══ 6. Collision ═══ */
function obbOverlap(a,b){
  const ax=[[a.c,-a.s],[a.s,a.c],[b.c,-b.s],[b.s,b.c]];
  for(const [nx,nz] of ax){
    const ra=a.hx*Math.abs(nx*a.c-nz*a.s)+a.hz*Math.abs(nx*a.s+nz*a.c);
    const rb=b.hx*Math.abs(nx*b.c-nz*b.s)+b.hz*Math.abs(nx*b.s+nz*b.c);
    if(Math.abs((b.x-a.x)*nx+(b.z-a.z)*nz)>ra+rb)return false;
  }
  return true;
}

function roadDist(x,z){

function ribbon(pts,width,yOff,mat,tile,ext=0,step=8){

  }

function curbLine(a,b,off,yaw,segLen,mat){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);if(len<0.01)return;
  const ux=dx/len,uz=dz/len,nx=-uz,nz=ux;
  const segs=Math.max(1,Math.ceil(len/segLen)),sLen=len/segs;
  for(let i=0;i<segs;i++){
    const t=(i+0.5)/segs,cx=a[0]+dx*t+nx*off,cz=a[1]+dz*t+nz*off,cy=terrainH(cx,cz);
    const L=new Loc(cx,cz,yaw,cy);
    L.box(0,0.12,0,0.34,0.20,sLen+0.15,mat);
  }
}
function buildCurbs(){
  const off=RW/2+0.16;
  for(const e of edges){
    const yaw=Math.atan2(e.dx,e.dz);
    curbLine(e.a,e.b,off,yaw,8,M.stoneDk);
    curbLine(e.a,e.b,-off,yaw,8,M.stoneDk);
  }
  const R=RING.r,N=48;
  for(let i=0;i<N;i++){
    const a0=i/N*TAU,a1=(i+1)/N*TAU;
    const A=[Math.cos(a0)*R,Math.sin(a0)*R],B=[Math.cos(a1)*R,Math.sin(a1)*R];
    const yaw=Math.atan2(B[0]-A[0],B[1]-A[1]),segLen=TAU*R/N;
    curbLine(A,B,off,yaw,segLen+0.5,M.stoneDk);

  }
  for(const d of DISCS){
    const rCurb=d.r+0.14,N2=20;
    for(let i=0;i<N2;i++){
      const a0=i/N2*TAU,a1=(i+1)/N2*TAU;
      const A=[d.x+Math.cos(a0)*rCurb,d.z+Math.sin(a0)*rCurb],B=[d.x+Math.cos(a1)*rCurb,d.z+Math.sin(a1)*rCurb];
      const yaw=Math.atan2(B[0]-A[0],B[1]-A[1]),segLen=TAU*rCurb/N2;
      curbLine(A,B,0,yaw,segLen+0.4,M.stoneDk);

  }
}

/* ═══ ԿԱՍԿԱԴ + ԿՈՂՔԻ ԱՍՏԻՃԱՆՆԵՐ ═══ */
function buildCascade(){
  // ─── 5 ՀՍԿԱ ՏԵՌԱՍ (|x| < STAIR_X0) ───
  for(let k=0;k<CAS.n;k++){
    const z0=CAS.z0+k*STEPLEN;
    const top=(k+1)*CAS.rise;
    const zC=z0+STEPLEN/2;
    const L=new Loc(0,zC,0,0);
    // Բետոնե/քարե պատերով տեռաս
    L.box(0,0,0,STAIR_X0*2,top,STEPLEN,M.terrace);
    L.solid(0,0,STAIR_X0*2,STEPLEN,top+0.1);
    // Սալիկապատ գագաթ
    L.box(0,top-0.08,0,STAIR_X0*2-0.4,0.1,STEPLEN-0.4,M.pave);
    // Ջրվեժի ջրամբար՝ տեռասի հետևի պատին
    if(k<CAS.n-1){
      L.box(0,top+0.05,STEPLEN/2-2,8,0.15,2,M.water);
    }
  }

  // ─── ԿՈՂՔԻ ԱՍՏԻՃԱՆՆԵՐ (STAIR_X0 → STAIR_X1) ───
  // Ֆիզիկայի համար սահուն ramp է (casStairH-ով), տեսողականորեն՝ աստիճաններ
  const nSteps=250;
  const stepLen=(CAS.z1-CAS.z0)/nSteps;
  const stepH=(CAS.rise*CAS.n)/nSteps;
  const T=new Loc(0,0,0,0);
  const xc=(STAIR_X0+STAIR_X1)/2;

  for(let i=0;i<nSteps;i++){
    const zq=CAS.z0+(i+0.5)*stepLen;
    const h=(i+1)*stepH;
    for(const s of[-1,1]){
      // Աստիճանի մարմին
      T.box(s*xc, h-stepH, zq, STAIR_W, stepH, stepLen+0.02, M.terrace);
      // Աստիճանի առջևի բարակ մուգ եզր
      T.box(s*xc, h-stepH-0.03, zq-stepLen/2, STAIR_W, 0.06, 0.1, M.stoneDk);
    }
  }

  // ─── ԱՐՏԱՔԻՆ ՊԱՏԵՐ (|x| = STAIR_X1)՝ ոչ մի տեղից չընկնես ───
  // Ոչ մի բարձր պատ, ուղղակի բարակ ցածր barrier
  for(const s of[-1,1]){
    for(let i=0;i<nSteps;i+=1){
      const zq=CAS.z0+(i+0.5)*stepLen;
      const h=(i+1)*stepH;
      T.box(s*(STAIR_X1-0.3), h-0.4, zq, 0.6, 0.4, stepLen+0.02, M.stoneDk);
    }
  }
}

function placeFillers(){

        const w=rr(20,30),d=rr(16,22),h=rr(11,26),YD=12;

        const off=HW+YD+d/2+1.5;

const cam={
  yaw:0.5, pitch:0.32, dist:800,
  target:new THREE.Vector3(0,50,400),
  drag:false, pid:null, lx:0, ly:0, rmb:false
};
function updateCam(){
  cam.pitch=clamp(cam.pitch,-0.05,1.4);
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw)*cp*cam.dist,
    cam.target.y + sp*cam.dist,
    cam.target.z + Math.cos(cam.yaw)*cp*cam.dist
  );
  camera.lookAt(cam.target);
  sky.position.copy(camera.position);
}
canvas.addEventListener('pointerdown',e=>{
  if(e.button===2){cam.rmb=true;cam.pid=e.pointerId;cam.lx=e.clientX;cam.ly=e.clientY;return;}
  cam.drag=true;cam.pid=e.pointerId;cam.lx=e.clientX;cam.ly=e.clientY;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==cam.pid)return;
  const dx=e.clientX-cam.lx,dy=e.clientY-cam.ly;
  cam.lx=e.clientX;cam.ly=e.clientY;
  if(cam.rmb){
    const s=cam.dist*0.0015;
    cam.target.x-=dx*Math.cos(cam.yaw)*s;
    cam.target.z+=dx*Math.sin(cam.yaw)*s;
    cam.target.y+=dy*s;
    return;
  }
  if(cam.drag){
    cam.yaw-=dx*0.006;
    cam.pitch+=dy*0.005;
  }
});
const endDrag=e=>{if(e.pointerId===cam.pid){cam.drag=false;cam.rmb=false;cam.pid=null;}};
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.dist=clamp(cam.dist*Math.exp(e.deltaY*0.001),60,3500);
},{passive:false});

  camera.updateProjectionMatrix();
});

/* ═══ 22. Ցիկլ ═══ */
let last=0,ema=16,adaptT=0;
function frame(t){
  requestAnimationFrame(frame);
  const now=t/1000;const dt=Math.min(0.05,now-last||0.016);last=now;
  updateCam();
  const texelSize=240/2048;
  const sx=Math.round(cam.target.x/texelSize)*texelSize;
  const sz=Math.round(cam.target.z/texelSize)*texelSize;
  sun.target.position.set(sx,0,sz);
  sun.position.set(sx-300,480,sz+210);
  renderer.render(scene,camera);
  ema+=(dt*1000-ema)*0.05;adaptT+=dt;
  if(adaptT>2.5){adaptT=0;if(ema>24&&pixScale>0.6){pixScale=Math.max(0.6,pixScale-0.15);renderer.setPixelRatio(pixScale);renderer.setSize(innerWidth,innerHeight,false);}}
}
function start(){
  try{
    buildWorld();
    const L=document.getElementById('loading');
    L.style.opacity=0;setTimeout(()=>L.remove(),700);
    updateCam();
    requestAnimationFrame(frame);
  }catch(err){
    console.error(err);
    document.getElementById('loading').textContent='Սխալ՝ '+err.message;
  }
}
setTimeout(start,30);
</script>
